worker_processes 1;
daemon off;
error_log logs/error.log;
pid logs/nginx.pid;

events {
    worker_connections 256;
}

http {
    default_type application/octet-stream;
    access_log logs/access.log;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path logs/tmp/client_body;
    proxy_temp_path logs/tmp/proxy;
    proxy_cache_path logs/cache keys_zone=ads_media:10m levels=1:2 max_size=1g inactive=365d use_temp_path=off;

    server {
        listen 8098;
        server_name localhost;

        location = /health {
            default_type text/plain;
            add_header Cache-Control "no-store";
            return 200 "ok\n";
        }

        # Browser-facing media CDN. Origin is MinIO path-style:
        # GET /ads-media/ads/{userId}/{userId}_{n}.ext
        #   -> http://127.0.0.1:9000/ads-media/ads/{userId}/{userId}_{n}.ext
        location /ads-media/ {
            limit_except GET HEAD {
                deny all;
            }

            proxy_pass http://127.0.0.1:9000/ads-media/;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:9000;
            proxy_set_header Connection "";

            proxy_hide_header Set-Cookie;
            proxy_hide_header x-amz-request-id;
            proxy_hide_header x-amz-id-2;

            proxy_cache ads_media;
            proxy_cache_valid 200 365d;
            proxy_cache_valid 404 10s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Access-Control-Allow-Origin "*" always;
        }
    }
}
